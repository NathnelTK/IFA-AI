<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<title>IFA - Your AI Learning Companion</title>
		<script>
			// Apply the saved/system color scheme before first paint so a first-time
			// visitor follows their OS preference and a returning visitor keeps their
			// choice — no light->dark flash and no defaulting to night mode.
			(function () {
				try {
					var theme = 'system';
					var stored = localStorage.getItem('ifa-preferences');
					if (stored) {
						var parsed = JSON.parse(stored);
						if (parsed && typeof parsed.theme === 'string') theme = parsed.theme;
					}
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = theme === 'dark' || (theme === 'system' && prefersDark);
					var root = document.documentElement;
					root.classList.toggle('dark', dark);
					root.dataset.theme = theme;
					root.dataset.resolvedTheme = dark ? 'dark' : 'light';
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-ifa-bg text-ifa-text-primary antialiased font-sans">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
