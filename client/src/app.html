<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Witforge - Learning and Course Creation</title>
		<script nonce="%sveltekit.nonce%">
			// Apply the saved/system color scheme before first paint so a first-time
			// visitor follows their OS preference and a returning visitor keeps their
			// choice — no light->dark flash and no defaulting to night mode.
			(function () {
				try {
					var theme = 'light';
					var stored = localStorage.getItem('witforge-preferences:device') || localStorage.getItem('ifa-preferences');
					if (stored) {
						var parsed = JSON.parse(stored);
						if (parsed?.theme === 'light' || parsed?.theme === 'dark') theme = parsed.theme;
						if (parsed?.theme === 'system' && parsed?.themeVersion === 2) theme = parsed.theme;
					}
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = theme === 'dark' || (theme === 'system' && prefersDark);
					var root = document.documentElement;
					root.classList.toggle('dark', dark);
					root.dataset.theme = theme;
					root.dataset.resolvedTheme = dark ? 'dark' : 'light';
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-ifa-bg text-ifa-text-primary antialiased font-sans">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
