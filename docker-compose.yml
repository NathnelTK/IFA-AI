name: ifa

services:
  postgres:
    image: postgres:16-alpine
    container_name: ifa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ifa}
      POSTGRES_USER: ${DB_USER:-ifa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - ifa-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ifa-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ifa-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ifa}
      DB_USER: ${DB_USER:-ifa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SCHOLARXIV_API_KEY: ${SCHOLARXIV_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-Groq}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "5011:8080"
    restart: unless-stopped
    networks:
      - ifa-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start-period: 60s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ifa-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: "http://localhost:5173"
      API_URL: "http://api:8080"
    ports:
      - "5173:3000"
    restart: unless-stopped
    networks:
      - ifa-network

volumes:
  ifa-postgres-data:
    driver: local

networks:
  ifa-network:
    driver: bridge
