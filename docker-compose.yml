name: ifa

services:
  postgres:
    image: postgres:16-alpine
    container_name: ifa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ifa}
      POSTGRES_USER: ${DB_USER:-ifa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ifa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ifa-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ifa}
      DB_USER: ${DB_USER:-ifa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5011:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ifa-web
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: "http://localhost:5173"
    ports:
      - "5173:3000"
    restart: unless-stopped

volumes:
  ifa-postgres-data:
