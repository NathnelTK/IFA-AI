name: ifa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ifa}
      POSTGRES_USER: ${DB_USER:-ifa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ifa-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ifa-network

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["dotnet", "worker/IFA.Worker.dll", "migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ifa}
      DB_USER: ${DB_USER:-ifa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    restart: "no"
    networks:
      - ifa-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_INITIALIZATION_MODE: none
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ifa}
      DB_USER: ${DB_USER:-ifa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BFF_INTERNAL_SECRET: ${BFF_INTERNAL_SECRET:-}
      AUTH_CONTEXT_PEPPER: ${AUTH_CONTEXT_PEPPER:-}
      AUTH_DATA_PROTECTION_KEY: ${AUTH_DATA_PROTECTION_KEY:-}
      Features__OpaqueSessions: ${Features__OpaqueSessions:-false}
      Features__Workspaces: ${Features__Workspaces:-false}
      Features__UnifiedAuthoring: ${Features__UnifiedAuthoring:-false}
      Features__AssetUploads: ${Features__AssetUploads:-false}
      Features__ImmutableReleases: ${Features__ImmutableReleases:-false}
      Features__Social: ${Features__Social:-false}
      Features__Certificates: ${Features__Certificates:-false}
      Features__Offers: ${Features__Offers:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://witforge.com}
      Features__PublicPresence: ${Features__PublicPresence:-false}
      Features__CustomDomains: ${Features__CustomDomains:-false}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-domains.witforge.com}
      R2_SERVICE_URL: ${R2_SERVICE_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-Groq}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      CHAPA_CALLBACK_URL: ${CHAPA_CALLBACK_URL:-}
      CHAPA_BASE_URL: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
      PAYMENT_RETURN_ORIGINS: ${PAYMENT_RETURN_ORIGINS:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "5011:8080"
    restart: unless-stopped
    networks:
      - ifa-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start-period: 60s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ifa}
      DB_USER: ${DB_USER:-ifa}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-Groq}
      AI_ALLOW_CROSS_PROVIDER_FAILOVER: ${AI_ALLOW_CROSS_PROVIDER_FAILOVER:-false}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      CHAPA_CALLBACK_URL: ${CHAPA_CALLBACK_URL:-}
      CHAPA_BASE_URL: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
      PAYMENT_RETURN_ORIGINS: ${PAYMENT_RETURN_ORIGINS:-http://localhost:5173}
      Workers__Generation__Enabled: "true"
      Workers__Outbox__Enabled: "true"
      BFF_INTERNAL_SECRET: ${BFF_INTERNAL_SECRET:-}
      AUTH_CONTEXT_PEPPER: ${AUTH_CONTEXT_PEPPER:-}
      AUTH_DATA_PROTECTION_KEY: ${AUTH_DATA_PROTECTION_KEY:-}
      Email__DeliveryMode: ${EMAIL_DELIVERY_MODE:-Development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:5173}
      Features__OpaqueSessions: ${Features__OpaqueSessions:-false}
      Features__Workspaces: ${Features__Workspaces:-false}
      Features__UnifiedAuthoring: ${Features__UnifiedAuthoring:-false}
      Features__AssetUploads: ${Features__AssetUploads:-false}
      Features__ImmutableReleases: ${Features__ImmutableReleases:-false}
      Features__Social: ${Features__Social:-false}
      Features__Certificates: ${Features__Certificates:-false}
      Features__Offers: ${Features__Offers:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://witforge.com}
      Features__PublicPresence: ${Features__PublicPresence:-false}
      Features__CustomDomains: ${Features__CustomDomains:-false}
      R2_SERVICE_URL: ${R2_SERVICE_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-domains.witforge.com}
    restart: unless-stopped
    networks:
      - ifa-network

  clamav:
    build:
      context: .
      dockerfile: docker/Dockerfile.clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - ifa-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: "http://api:8080"
      BFF_INTERNAL_SECRET: ${BFF_INTERNAL_SECRET:-}
      AUTH_HOST: ${AUTH_HOST:-auth.witforge.com}
      APP_HOST: ${APP_HOST:-app.witforge.com}
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-witforge.com,www.witforge.com}
      PUBLIC_AUTH_ORIGIN: ${PUBLIC_AUTH_ORIGIN:-http://localhost:5173}
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: "http://localhost:5173"
    ports:
      - "5173:3000"
    restart: unless-stopped
    networks:
      - ifa-network

volumes:
  ifa-postgres-data:
    driver: local

networks:
  ifa-network:
    driver: bridge
